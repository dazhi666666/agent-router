<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务与成员 · Agent Router</title><link rel="stylesheet" href="/router-ui.css"><link rel="stylesheet" href="/board.css"></head><body class="ar-ui board-page">
<header class="board-header"><a href="/" class="board-brand">⧉ Agent Router</a><span>任务与成员</span><a class="ar-button" href="/console/">经典控制台 ↗</a></header>
<main class="board-main"><div class="board-heading"><div><p class="eyebrow">COLLABORATION OVERVIEW</p><h1>每一步协作，都有迹可循。</h1></div><select id="run-sel" aria-label="选择运行"><option>正在加载…</option></select></div>
<section class="run-overview"><div class="overview-title"><strong id="goal">请选择一次运行</strong><span id="connection" role="status">加载中</span></div><p id="run-meta"></p><div id="metrics" class="metrics"></div></section>
<p id="error" role="alert" class="ar-error"></p><div id="finish-banner" hidden></div>
<div class="board-tabs" role="tablist" aria-label="协作内容"><button id="tab-tasks" role="tab" aria-selected="true" aria-controls="tasks-panel">任务 <span id="t-count">0</span></button><button id="tab-mail" role="tab" aria-selected="false" aria-controls="mail-panel">信箱 <span id="m-count">0</span></button></div>
<section id="tasks-panel" role="tabpanel" aria-labelledby="tab-tasks"><div class="filters"><select id="filter-status" aria-label="筛选任务状态"><option value="">全部状态</option><option value="in_progress">执行中</option><option value="failed">失败</option><option value="pending">待执行</option><option value="done">已完成</option></select><select id="filter-agent" aria-label="筛选执行成员"><option value="">全部成员</option></select><span>优先显示执行中与失败任务</span></div><div id="tasks" class="task-list"></div></section>
<section id="mail-panel" role="tabpanel" aria-labelledby="tab-mail" hidden><form id="message-form" class="message-form"><div class="message-head"><label>接收者 <select id="recipient" aria-label="消息接收者"></select></label><span>仅发送到当前运行</span></div><textarea id="message" rows="3" maxlength="16000" placeholder="直接向主代理或指定子代理发送指示…" aria-label="消息内容" required></textarea><div class="message-foot"><small>子代理消息写入信箱，在其读取信箱时接收。</small><button id="send" class="primary">发送消息</button></div><p id="message-result" role="status"></p></form><div id="mail" class="mail-list"></div></section>
</main><dialog id="log-dialog"><div class="log-heading"><strong id="log-title">会话日志</strong><button id="log-close" aria-label="关闭日志">✕</button></div><pre id="log-content"></pre></dialog><script src="/board.js"></script></body></html>
